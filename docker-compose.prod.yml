version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: shopease_root
      MYSQL_DATABASE: shopease
      MYSQL_USER: shopease_user
      MYSQL_PASSWORD: shopease_pass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    restart: unless-stopped

  app:
    build: ./app
    environment:
      DB_HOST: db
      DB_USER: shopease_user
      DB_PASS: shopease_pass
      DB_NAME: shopease
      SESSION_SECRET: secret123
    depends_on:
      - db
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:
