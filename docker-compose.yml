version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: shopease_root
      MYSQL_DATABASE: shopease
      MYSQL_USER: shopease_user
      MYSQL_PASSWORD: shopease_pass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: ./app
    environment:
      DB_HOST: db
      DB_USER: shopease_user
      DB_PASS: shopease_pass
      DB_NAME: shopease
      SESSION_SECRET: secret123
    depends_on:
      - db
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  db_data:
